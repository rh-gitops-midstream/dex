version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - depguard
    - dogsled
    - exhaustive
    - gochecknoinits
    - gocritic
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - staticcheck
    - unconvert
    - unused
    - whitespace

    # Disable temporarily until everything works with Go 1.20
    # - bodyclose
    # - rowserrcheck
    # - tparallel
    # - unparam

    # Disable temporarily until the following issue is resolved:
    # https://github.com/golangci/golangci-lint/issues/3086
    - sqlclosecheck

    # TODO: fix linter errors before enabling
    # - exhaustivestruct
    # - gochecknoglobals
    # - errorlint
    # - gocognit
    # - godot
    # - nlreturn
    # - noctx
    # - revive
    # - wrapcheck

    # TODO: fix linter errors before enabling (from original config)
    # - dupl
    # - errcheck
    # - goconst
    # - gocyclo
    # - gosec
    # - lll
    # - scopelint

    # unused
    # - goheader
    # - gomodguard

    # don't enable:
    # - asciicheck
    # - funlen
    # - godox
    # - goerr113
    # - gomnd
    # - interfacer
    # - maligned
    # - nestif
    # - testpackage
    # - wsl
  settings:
    depguard:
      rules:
        deprecated:
          deny:
            - pkg: io/ioutil
              desc: The 'io/ioutil' package is deprecated. Use corresponding 'os' or 'io' functions instead.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - storage/ent/db
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/dexidp/dex)
    goimports:
      local-prefixes:
        - github.com/dexidp/dex
  exclusions:
    generated: lax
    paths:
      - storage/ent/db
      - third_party$
      - builtin$
      - examples$
